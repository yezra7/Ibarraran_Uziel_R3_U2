
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de la persona Usuaria</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="contenedor">
        <form id="formulario" action="#" method="get">

            <h1>Registro de la persona Usuaria</h1>
            <p class="subtitulo">¡Únete a nuestra comunidad!</p>

            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido"
                       placeholder="Escribe tu apellido" required>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena"
                       placeholder="Crea una contraseña" required>
            </div>

            <div class="campo">
                <label for="descripcion">Sobre mí:</label>
                <textarea id="descripcion" name="descripcion"
                          rows="4"
                          placeholder="Cuéntanos un poco sobre ti..."></textarea>
            </div>

            <fieldset class="intereses">
                <legend>Mis intereses:</legend>

                <label>
                    <input type="checkbox" name="intereses" value="Tecnologia">
                    Tecnología
                </label>

                <label>
                    <input type="checkbox" name="intereses" value="Arte">
                    Arte
                </label>

                <label>
                    <input type="checkbox" name="intereses" value="Deporte">
                    Deporte
                </label>
            </fieldset>

            <button type="submit">Registrarse</button>

        </form>
    </main>

</body>
</html>
